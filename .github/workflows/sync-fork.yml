# Keeps the fork vanjakovacevic1/GoldClub_BeautySalon in sync with
# anjakovacevic/GoldClub_BeautySalon and refreshes its GitHub Pages site.
#
# Runs every 30 minutes and does nothing when there are no new commits.
# It can also be started by hand: Actions -> "Sync fork" -> Run workflow.
# The `if:` guard means it only ever runs in the fork, never in the original repo.

name: Sync fork

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'vanjakovacevic1/GoldClub_BeautySalon'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: anjakovacevic/GoldClub_BeautySalon
    steps:
      - name: Pull new commits from the original repo
        id: sync
        run: |
          before=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          gh repo sync "$GITHUB_REPOSITORY" --source "$UPSTREAM" --branch main
          after=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$before" = "$after" ]; then
            echo "No new commits."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Synced: $before -> $after"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commits pushed with the workflow token don't start the Pages build on
      # their own, so ask for one explicitly when something changed.
      - name: Rebuild GitHub Pages
        if: steps.sync.outputs.changed == 'true'
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
